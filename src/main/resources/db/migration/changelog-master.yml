databaseChangeLog:
  - changeSet:
    id: V001_create_users_table
    author: RocketBunny
    changes:
      - createTable:
          tableName: users
          columns:
            - column:
                name: id
                type: bigint
                autoIncrement: true
                constraints:
                  primaryKey: true
                  primaryKeyName: pk_users
            - column:
                name: username
                type: varchar(255)
                constraints:
                  unique: true
                  nullable: false
            - column:
                name: password
                type: varchar(255)
                constraints:
                  nullable: false
            - column:
               name: role
               type: varchar(15)
               constraints:
                 nullable: false
      - createIndex:
          indexName: idx_users_username
          tableName: users
          columns:
            - column:
                name: username
  - changeSet:
    id: V002_create_cards_table
    author: RocketBunny
    changes:
      - sql:
          sql: CREATE EXTENSION IF NOT EXISTS pgcrypto;
      - createTable:
          tableName: cards
          columns:
            - column:
                name: id
                type: bigint
                autoIncrement: true
                constraints:
                  primaryKey: true
                  primaryKeyName: pk_cards
            - column:
               name: number
               type: bytea
               constraints:
                 nullable: false
            - column:
                name: status
                type: varchar(15)
                constraints:
                  nullable: false
            - column:
                name: balance
                type: numeric(15,2)
                constraints:
                  nullable: false
            - column:
                name: expiry_date
                type: date
            - column:
                name: owner
                type: varchar(255)
                constraints:
                  nullable: false
            - column:
                name: user_id
                type: bigint
                constraints:
                  nullable: false
                  foreignKey: fk_cards_user
                  references: users(id)
      - createIndex:
          indexName: idx_cards_user
          tableName: cards
          columns:
            - column:
                name: user_id